<div class="rounded-xl border border-glass-border-soft bg-glass-fill p-5">

  <div class="mb-3 text-xs font-medium uppercase tracking-wider text-accent-2">
    Heading
  </div>

  @switch (data().level) {

    @case (1) {
      <h1 class="text-2xl font-semibold text-text-primary">
        {{ data().text }}
      </h1>
    }

    @case (2) {
      <h2 class="text-xl font-semibold text-text-primary">
        {{ data().text }}
      </h2>
    }

    @case (3) {
      <h3 class="text-lg font-semibold text-text-primary">
        {{ data().text }}
      </h3>
    }

    @case (4) {
      <h4 class="text-base font-semibold text-text-primary">
        {{ data().text }}
      </h4>
    }

    @case (5) {
      <h5 class="text-sm font-semibold text-text-primary">
        {{ data().text }}
      </h5>
    }

    @case (6) {
      <h6 class="text-xs font-semibold text-text-primary">
        {{ data().text }}
      </h6>
    }

  }

</div>
