<button
  type="button"
  class="theme-switcher"
  (click)="toggle()"
  [attr.aria-label]="'Current theme: ' + themeService.theme() + '. Click to change theme.'"
  [attr.title]="'Theme: ' + themeService.theme()"
>
  @if (themeService.theme() === 'light') {
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
      class="theme-icon"
    >
      <circle
        cx="12"
        cy="12"
        r="4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      />

      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  }

  @if (themeService.theme() === 'dark') {
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
      class="theme-icon"
    >
      <path
        d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5
           A8.5 8.5 0 1 0 20.5 15.5Z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
    </svg>
  }

</button>
